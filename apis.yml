name: Partyphile
description: Partyphile (formerly Guestlist.ph) is a Manila, Philippines nightlife and events
  startup that built a consumer mobile app for discovering clubs, bars, parties, and events,
  getting on club guest lists to waive cover charges and skip lines, and booking VIP tables.
  Founded by Ron Baetiong out of a University of Santo Tomas thesis, it raised seed funding from
  500 Startups (500 Global) and Kickstart Ventures and planned Southeast Asia expansion. It was
  surfaced as a 500 Global portfolio company and added to the API Evangelist network. As of this
  enrichment pass the company presents no public developer or API surface — its primary domain
  partyphile.com no longer resolves and partyphile.ph is unreachable — so no API artifacts exist to
  harvest; this remains a company identity profile.
